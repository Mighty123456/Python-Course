apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-frontend-deployment
  labels:
    app: express-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-frontend
  template:
    metadata:
      labels:
        app: express-frontend
    spec:
      containers:
      - name: express-frontend
        image: express-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://flask-backend-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: express-frontend-service
spec:
  type: NodePort
  selector:
    app: express-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
