{% extends "accounts/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h2>Home</h2>
{% if user.is_authenticated %}
  <p>Hi {{ user.username }} — you are logged in.</p>
{% else %}
  <p>Welcome, please <a href="{% url 'login' %}">login</a> or <a href="{% url 'register' %}">register</a>.</p>
{% endif %}
{% endblock %}
