<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Integrated Auth{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/modern-normalize@1.1.0/modern-normalize.min.css" rel="stylesheet">
  <style>
    body{font-family: Arial, sans-serif; max-width:900px; margin:30px auto; padding:0 15px;}
    header nav a{margin-right:10px;}
    .container{margin-top:20px;}
    .messages{margin-bottom:15px;}
    .errorlist{color:darkred;}
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>
  </header>

  <div class="container">
    <div class="messages">
      {% if messages %}
        <ul>
          {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
